# Codemagic CI/CD — builds the DarkFlow Flutter app (in review_app/) for iOS
# and ships it to TestFlight with automatic code signing.
#
# ONE-TIME SETUP in the Codemagic UI before the first build:
#  1. Teams → Integrations → App Store Connect: add your App Store Connect API
#     key (.p8 + Key ID + Issuer ID). The integration is named `Dark` (must match
#     the name under `integrations.app_store_connect` below).
#  2. Create an environment variable GROUP named `darkflow_config` with:
#        - API_BASE_URL  = your backend URL (e.g. the Cloudflare tunnel HTTPS URL)
#        - API_TOKEN     = the same value as backend .env API_AUTH_TOKEN  (mark as Secure)
#     These are injected at build time via --dart-define (never committed to git).

workflows:
  ios-testflight:
    name: DarkFlow iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: review_app
    integrations:
      app_store_connect: Dark
    environment:
      # NOTE: no `ios_signing` block on purpose — signing is done fully manually in
      # the script below so the cert + provisioning profile get CREATED on the first
      # build (the ios_signing block only fetches existing ones and fails first).
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - darkflow_config            # provides API_BASE_URL and API_TOKEN
      vars:
        BUNDLE_ID: "com.caio.darkflow"
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Set up code signing (creates distribution cert + profile if missing)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA (with backend URL + token baked in)
        script: |
          flutter build ipa --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=API_TOKEN="$API_AUTH_TOKEN" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
