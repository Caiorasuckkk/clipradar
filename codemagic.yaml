# Codemagic CI/CD — builds the DarkFlow Flutter app (in review_app/) for iOS
# and ships it to TestFlight with automatic code signing.
#
# ONE-TIME SETUP in the Codemagic UI before the first build:
#  1. Teams → Integrations → App Store Connect: add your App Store Connect API
#     key (.p8 + Key ID + Issuer ID). Name the integration exactly:  AppStore
#     (or change the name under `integrations.app_store_connect` below to match).
#  2. Create an environment variable GROUP named `darkflow_config` with:
#        - API_BASE_URL  = your backend URL (e.g. the Cloudflare tunnel HTTPS URL)
#        - API_TOKEN     = the same value as backend .env API_AUTH_TOKEN  (mark as Secure)
#     These are injected at build time via --dart-define (never committed to git).

workflows:
  ios-testflight:
    name: DarkFlow iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: review_app
    integrations:
      app_store_connect: AppStore
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.caio.darkflow
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - darkflow_config            # provides API_BASE_URL and API_TOKEN
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Set up provisioning profiles
        script: xcode-project use-profiles
      - name: Build IPA (with backend URL + token baked in)
        script: |
          flutter build ipa --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=API_TOKEN="$API_TOKEN" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
